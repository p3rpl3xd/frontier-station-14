# Sentencing locker, prisoner ID, ore redemption, points console, gates, and shuttle access.
# These parent the upstream genpop pieces. They do not replace them.

- type: entity
  parent: PrisonerIDCard
  id: PrisonerIDCardLabor
  name: labor camp prisoner ID
  description: A prisoner ID that can carry a labor point goal as well as a genpop timer.
  components:
  - type: Access
    tags:
    - GenpopEnter
  - type: LaborCampSentence
  - type: ExpireIdCard
    expireMessage: labor-camp-id-expire
    expiredAccess:
    - GenpopLeave
    - LaborCampShuttle

- type: entity
  parent: LockerPrisoner
  id: LockerPrisonerLabor
  name: labor camp prisoner locker
  description: A genpop locker that sentences a prisoner to time, points, or both.
  suffix: Labor
  components:
  - type: LaborCampLocker
  - type: UserInterface
    interfaces:
      enum.GenpopLockerUiKey.Key:
        type: LaborCampLockerBoundUserInterface

- type: entity
  parent: BaseWallLocker
  id: LockerWallPrisonerLabor
  name: labor camp prisoner wall locker
  description: A wall-mounted genpop locker that sentences a prisoner to time, points, or both.
  suffix: Labor
  components:
  - type: LaborCampLocker
  - type: EntityStorageVisuals
    stateBaseClosed: genpop
    stateDoorOpen: genpop_open
    stateDoorClosed: genpop_door_1
  - type: UserInterface
    interfaces:
      enum.GenpopLockerUiKey.Key:
        type: LaborCampLockerBoundUserInterface
  - type: AccessReader
    access: [["Security"]]

- type: entity
  parent: BaseMachine
  id: LaborCampRedemption
  name: labor camp ore redemption
  description: Feed it ore. The ore's credit value is added to the prisoner's labor points, then the ore is consumed.
  components:
  - type: Sprite
    sprite: Structures/Machines/ore_processor.rsi
    layers:
    - state: icon
  - type: LaborCampRedemption

- type: entity
  parent: BaseComputer
  id: LaborCampConsole
  name: labor camp points console
  description: Shows a prisoner's labor points, the point goal, and the time left on the genpop timer.
  components:
  - type: LaborCampConsole
  - type: ActivatableUI
    key: enum.LaborCampConsoleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LaborCampConsoleUiKey.Key:
        type: LaborCampConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ApcPowerReceiver
    needsPower: false
  - type: Sprite
    layers:
    - map: ["computerLayerBody"]
      state: computer
    - map: ["computerLayerKeyboard"]
      state: generic_keyboard
    - map: ["computerLayerScreen"]
      state: generic
    - map: ["computerLayerKeys"]
      state: generic_keys
    - map: ["enum.WiresVisualLayers.MaintenancePanel"]
      state: generic_panel_open

- type: entity
  parent: TurnstileGenpopEnter
  id: EnergyGateGenpopEnter
  name: labor camp entry gate
  suffix: Genpop Enter
  description: The genpop entry gate. Prisoner IDs with GenpopEnter access can pass. Security can pass. This fork has no separate energy-barrier entity, so this is the upstream genpop entry turnstile.
  components:
  - type: Airtight

- type: entity
  parent: TurnstileGenpopLeave
  id: EnergyGateGenpopLeave
  name: labor camp exit gate
  suffix: Genpop Leave
  description: The genpop exit gate. It opens for GenpopLeave, which a prisoner ID gains when the timer or the point goal finishes. Security can pass.
  components:
  - type: Airtight

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsLaborCampShuttle
  suffix: Labor Camp Shuttle
  categories: [ HideSpawnMenu ]
  components:
  - type: AccessReader
    access: [["LaborCampShuttle"], ["Security"]]

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsLaborCampDock
  suffix: Labor Camp Dock
  categories: [ HideSpawnMenu ]
  components:
  - type: AccessReader
    access: [["Security"]]

- type: entity
  parent: DoorElectronics
  id: DoorElectronicsLaborCampCockpit
  suffix: Labor Camp Cockpit
  categories: [ HideSpawnMenu ]
  components:
  - type: AccessReader
    access: [["LaborCampShuttle"], ["Security"]]

- type: entity
  parent: ComputerShuttle
  id: ComputerShuttleLaborCamp
  name: labor camp shuttle console
  suffix: Labor Camp
  description: Helm of the prisoner shuttle. It docks at the labor camp or the main station, and nowhere else.
  components:
  - type: AccessReader
    access: [["LaborCampShuttle"], ["Security"]]
  - type: ActivatableUI
    key: enum.LaborCampShuttleUiKey.Key
  - type: UserInterface
    interfaces:
      enum.LaborCampShuttleUiKey.Key:
        type: LaborCampShuttleBoundUserInterface
      enum.ShuttleConsoleUiKey.Key:
        type: ShuttleConsoleBoundUserInterface
      enum.WiresUiKey.Key:
        type: WiresBoundUserInterface
  - type: ActivatableUIRequiresAccess
  - type: ApcPowerReceiver
    needsPower: false
  - type: Construction
    deconstructionTarget: null
  - type: Anchorable
    flags:
    - Anchorable
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: AirlockShuttle
  id: AirlockLaborCampShuttle
  name: labor camp shuttle airlock
  suffix: Labor Camp
  description: Dock airlock on the prisoner shuttle. Opens for a served sentence, or for security.
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsLaborCampShuttle ]
  - type: Construction
    deconstructionTarget: null
  - type: Anchorable
    flags:
    - Anchorable
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: Airlock
  id: AirlockLaborCampCockpit
  name: labor camp cockpit
  suffix: Labor Camp
  description: The door into the shuttle cockpit. A served sentence or security can open it. The helm only docks at the camp or the main station.
  components:
  - type: LaborCampCockpitDoor
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsLaborCampCockpit ]
  - type: Construction
    deconstructionTarget: null
  - type: Anchorable
    flags:
    - Anchorable
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: AirlockShuttle
  id: AirlockLaborCampDock
  name: labor camp dock
  suffix: Labor Camp
  description: Camp side of the prisoner shuttle dock. The shuttle airlock and the helm are on the shuttle.
  components:
  - type: ContainerFill
    containers:
      board: [ DoorElectronicsLaborCampDock ]

- type: entity
  parent: Thruster
  id: ThrusterLaborCamp
  name: labor camp thruster
  suffix: Labor Camp
  description: A thruster fixed to the prisoner shuttle. While the route lock is on, it does not push the ship.
  components:
  - type: Construction
    deconstructionTarget: null
  - type: Anchorable
    flags:
    - Anchorable
  - type: ApcPowerReceiver
    needsPower: false
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: Gyroscope
  id: GyroscopeLaborCamp
  name: labor camp gyroscope
  suffix: Labor Camp
  description: A gyroscope fixed to the prisoner shuttle. While the route lock is on, it does not turn the ship.
  components:
  - type: Construction
    deconstructionTarget: null
  - type: Anchorable
    flags:
    - Anchorable
  - type: ApcPowerReceiver
    needsPower: false
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: WallSolid
  id: WallLaborCamp
  name: labor camp wall
  suffix: Labor Camp
  description: A wall of the prisoner shuttle. It is not meant to be taken apart.
  components:
  - type: Construction
    deconstructionTarget: null
  - type: RCDDeconstructable
    deconstructable: false

- type: entity
  parent: AsteroidRock
  id: LaborCampRock
  name: labor camp rock
  description: A mineable rock in the labor camp. It grows back with a new ore roll.
  components:
  - type: OreVein
    oreChance: 1
    oreRarityPrototypeId: RandomOreDistributionStandard

- type: entity
  parent: BaseStructure
  id: SignLaborCamp
  name: labor camp sign
  description: A sign for a labor camp outpost.
  components:
  - type: Sprite
    sprite: _LaborCamp/sign.rsi
    state: icon
    drawdepth: WallMountedItems
  - type: Physics
    bodyType: Static
  - type: Fixtures
    fixtures:
      fix1:
        shape:
          !type:PhysShapeAabb
          bounds: "-0.4,-0.4,0.4,0.4"
        density: 20
        mask:
        - Impassable
        layer:
        - WallLayer
